<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#06142b" />
    <title>Página no encontrada · Universo Memorias</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background: #06142b;
        color: #e8f5ff;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        line-height: 1.6;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(1.75rem, 6vw, 2.25rem);
        line-height: 1.15;
      }
      p {
        margin: 0 0 1.75rem;
        color: #9cc2e2;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        padding: 0 1.5rem;
        border-radius: 9999px;
        background: #3fd8ff;
        color: #04152b;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #3fd8ff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Página no encontrada</h1>
      <p>La dirección que buscas no existe o cambió de lugar.</p>
      <a href="/">Volver al inicio</a>
    </main>
  </body>
</html>
